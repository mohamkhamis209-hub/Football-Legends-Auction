<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مزاد الأساطير</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة تحميل -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">⚽ جاري التحميل...</div>
        <div style="color:#555;font-size:0.7em;margin-top:8px;letter-spacing:2px;">مزاد الأساطير</div>
    </div>

    <!-- خلفية -->
    <div class="stars" id="stars"></div>
    <div class="football-bg">⚽</div>

    <div class="setup-container" id="setupScreen">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <div class="logo">
                <span class="icon">🏆</span>
                <span class="gold-text">مزاد<span class="sub-text">الأساطير</span></span>
            </div>
            <div class="top-stats">
                <div class="stat-item">
                    <div class="label">المدربين</div>
                    <div class="value" id="displayCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="label">التشكيلة</div>
                    <div class="value" id="displayFormation">4-3-3</div>
                </div>
            </div>
        </div>

        <!-- العنوان -->
        <div class="header-section">
            <h1 class="main-title">🔥 المزاد الأسطوري</h1>
            <p class="main-subtitle">أذكى مدرب يبني أقوى فريق في التاريخ</p>
        </div>

        <!-- وضع اللعب -->
        <div class="setup-group" style="margin-bottom:10px;">
            <labe>🎮 وضع اللعب</label>
            <select id="gameMode" onchange="toggleAIMode()">
                <option value="local">مع الاصدقاء </option>
                <option value="ai" selected>ضد الكمبيوتر (AI)</option>
            </select>
        </div>

        <!-- مستوى صعوبة الكمبيوتر (يظهر في وضع AI) -->
        <div class="setup-group" id="aiDifficultyGroup" style="margin-bottom:10px;">
            <label>🤖 مستوى صعوبة الكمبيوتر</label>
            <select id="aiDifficulty">
                <option value="easy">سهل</option>
                <option value="medium" selected>متوسط</option>
                <option value="hard">صعب</option>
            </select>
        </div>

        <!-- الإعدادات الأساسية -->
        <div class="setup-grid">
            <div class="setup-group">
                <label>💰 رأس المال</label>
                <div class="input-wrapper">
                    <input type="number" id="budget" value="100" min="50" max="500">
                    <span class="input-suffix">مليون €</span>
                </div>
            </div>
            <div class="setup-group">
                <label>📋 التشكيلة</label>
                <select id="formation" onchange="updateDisplay()">
                    <option value="4-3-3">4-3-3 (هجومي)</option>
                    <option value="4-4-2">4-4-2 (متوازن)</option>
                    <option value="3-5-2">3-5-2 (دفاعي)</option>
                </select>
            </div>
        </div>

        <!-- المدربين -->
        <div class="coaches-section">
            <div class="coaches-header">
                <label>✏️ أسماء المدربين (حد أقصى 4)</label>
                <button type="button" class="btn-add-coach" onclick="addCoach()">
                    <span>➕</span> إضافة مدرب
                </button>
            </div>
            <div id="coachNamesContainer">
                <!-- سيتم إضافة المدربين ديناميكياً -->
            </div>
            <div id="coachWarning" style="color:#ff6b6b;font-size:0.8em;margin-top:8px;display:none;">
                ⚠️ يجب إضافة مدربين على الأقل
            </div>
        </div>

        <!-- زر البداية -->
        <button class="btn-start" onclick="startGame()">
            <span class="btn-icon">🚀</span> ابدأ المزاد
        </button>

        <!-- تذييل -->
        <div class="footer">
            ⚡ كل الحقوق محفوظة © 2026
        </div>
    </div>

    <script>
        // ===== إدارة المدربين =====
        let coachNames = [];

        function toggleAIMode() {
            const mode = document.getElementById('gameMode').value;
            const difficultyGroup = document.getElementById('aiDifficultyGroup');
            if (mode === 'ai') {
                difficultyGroup.style.display = 'block';
                // في وضع AI، لازم يكون في مدربين (اللاعب + الكمبيوتر)
                if (coachNames.length < 2) {
                    // لو مفيش مدربين كافيين، نضيف مدربين افتراضيين
                    while (coachNames.length < 2) {
                        coachNames.push(`مدرب ${coachNames.length+1}`);
                    }
                    renderCoachInputs();
                }
            } else {
                difficultyGroup.style.display = 'none';
            }
        }

        function loadSavedCoachNames() {
            const saved = localStorage.getItem('savedCoachNames');
            if (saved) {
                try {
                    const names = JSON.parse(saved);
                    if (Array.isArray(names) && names.length > 0) {
                        coachNames = names;
                        return true;
                    }
                } catch(e) {}
            }
            // لو مفيش أسماء محفوظة، نبدأ بمدربين افتراضيين
            coachNames = ['مدرب 1', 'مدرب 2'];
            return false;
        }

        function saveCoachNames() {
            const names = coachNames.filter(n => n.trim() !== '');
            if (names.length > 0) {
                localStorage.setItem('savedCoachNames', JSON.stringify(names));
            }
        }

        function renderCoachInputs() {
            const container = document.getElementById('coachNamesContainer');
            container.innerHTML = '';
            coachNames.forEach((name, index) => {
                const div = document.createElement('div');
                div.className = 'coach-input-row';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.value = name;
                input.placeholder = `المدرب ${index+1}`;
                input.addEventListener('input', (e) => {
                    coachNames[index] = e.target.value;
                    saveCoachNames();
                });
                
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn-remove-coach';
                removeBtn.textContent = '✖';
                removeBtn.onclick = () => {
                    if (coachNames.length <= 2) {
                        alert('يجب أن يكون هناك مدربان على الأقل');
                        return;
                    }
                    coachNames.splice(index, 1);
                    saveCoachNames();
                    renderCoachInputs();
                    updateDisplay();
                };
                
                div.appendChild(input);
                div.appendChild(removeBtn);
                container.appendChild(div);
            });
            updateDisplay();
        }

        function addCoach() {
            const mode = document.getElementById('gameMode').value;
            const maxCoaches = mode === 'ai' ? 2 : 4; // في وضع AI، حد أقصى 2 (اللاعب + الكمبيوتر)
            
            if (coachNames.length >= maxCoaches) {
                alert(`⚠️ في وضع ${mode === 'ai' ? 'ضد الكمبيوتر' : 'المحلي'}، الحد الأقصى ${maxCoaches} مدربين`);
                return;
            }
            
            const newIndex = coachNames.length + 1;
            let newName = `مدرب ${newIndex}`;
            let counter = newIndex;
            while (coachNames.includes(newName)) {
                counter++;
                newName = `مدرب ${counter}`;
            }
            coachNames.push(newName);
            saveCoachNames();
            renderCoachInputs();
        }

        function updateDisplay() {
            document.getElementById('displayCount').textContent = coachNames.length;
            const form = document.getElementById('formation').value;
            document.getElementById('displayFormation').textContent = form;
            
            const warning = document.getElementById('coachWarning');
            if (coachNames.length < 2) {
                warning.style.display = 'block';
                warning.textContent = `⚠️ يجب إضافة ${2 - coachNames.length} مدربين على الأقل`;
            } else {
                warning.style.display = 'none';
            }
        }

        window.startGame = function() {
            const mode = document.getElementById('gameMode').value;
            const names = coachNames.filter(n => n.trim() !== '');
            
            if (names.length < 2) {
                alert('⚠️ يجب إضافة مدربين على الأقل (2 مدربين)');
                return;
            }
            
            // في وضع AI، نأخذ أول مدرب كلاعب والباقي كمبيوتر
            saveCoachNames();
            localStorage.setItem('tempCoachNames', JSON.stringify(names));
            localStorage.setItem('gameMode', mode);
            localStorage.setItem('aiDifficulty', document.getElementById('aiDifficulty').value);
            
            if (typeof window.startGameOriginal === 'function') {
                window.startGameOriginal();
            } else {
                alert('حدث خطأ، يرجى تحديث الصفحة');
            }
        };

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                star.style.width = (1 + Math.random() * 3) + 'px';
                star.style.height = star.style.width;
                container.appendChild(star);
            }
        }
        createStars();

        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
        }, 800);

        loadSavedCoachNames();
        renderCoachInputs();
        toggleAIMode();
        
        window.addCoach = addCoach;
        window.toggleAIMode = toggleAIMode;
        window.renderCoachInputs = renderCoachInputs;
    </script>

    <script src="players.js"></script>
    <script src="script.js"></script>
</body>
</html>
