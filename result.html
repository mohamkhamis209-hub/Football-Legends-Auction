<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مزاد الأساطير - النتيجة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="football-bg">⚽</div>

    <div class="result-container" id="resultScreen">
        <div class="top-bar">
            <div class="logo">
                <span class="icon">🏆</span>
                <span class="gold-text">النتيجة</span>
            </div>
            <div class="top-stats">
                <div class="stat-item">
                    <div class="label">🏆 التشكيلة الأقوى</div>
                    <div class="value" id="winnerName" style="font-size:1.2em;">---</div>
                </div>
            </div>
        </div>

        <h1 class="main-title" style="font-size:2.2em;">🏆 النتيجة النهائية</h1>
        <p class="main-subtitle" id="winnerAnnounce" style="font-size:1.3em;color:var(--gold);">
            🏆 التشكيلة الأقوى: ---
        </p>

        <div class="result-grid" id="resultGrid"></div>

        <!-- أزرار النتيجة في النص -->
        <div class="result-actions">
            <button class="btn btn-primary" onclick="window.location.href='index.html'">🔄 لعبة جديدة</button>
            <button class="btn btn-gold-outline" onclick="window.location.href='index.html'">⚙️ إعدادات</button>
        </div>
    </div>

    <script src="players.js"></script>
    <script src="script.js"></script>
    <script>
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                star.style.width = (1 + Math.random() * 3) + 'px';
                star.style.height = star.style.width;
                container.appendChild(star);
            }
        }
        createStars();
    </script>
</body>
</html>
